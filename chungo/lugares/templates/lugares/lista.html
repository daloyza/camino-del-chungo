{% extends "lugares/base.html" %}

{% block contenido %}
<h1>Lugares del camino</h1>

{% for lugar in lugares %}
    <div class="tarjeta">
        {% if lugar.foto %}
            <img class="foto" src="{{ lugar.foto.url }}" alt="Foto de {{ lugar.nombre }}">
        {% else %}
            <div class="sin-foto">Este lugar todavía no tiene foto</div>
        {% endif %}
        <h2><a href="{% url 'detalle' lugar.id %}">{{ lugar.nombre }}</a></h2>
    </div>
{% empty %}
    <p class="mensaje">Todavía no hay lugares cargados.</p>
{% endfor %}
{% endblock %}

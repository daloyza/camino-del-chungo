{% extends "lugares/base.html" %}

{% block contenido %}
<h1>{{ t.lista_titulo }}</h1>

{% for lugar in lugares %}
    <div class="tarjeta">
        {% if lugar.foto %}
            <img class="foto" src="{{ lugar.foto.url }}" alt="{{ t.foto_de }} {{ lugar.nombre_mostrado }}">
        {% else %}
            <div class="sin-foto">{{ t.sin_foto }}</div>
        {% endif %}
        <h2><a href="{% url 'detalle' lugar.id %}">{{ lugar.nombre_mostrado }}</a></h2>
    </div>
{% empty %}
    <p class="mensaje">{{ t.sin_lugares }}</p>
{% endfor %}
{% endblock %}

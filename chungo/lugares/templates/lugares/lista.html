<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>El camino del chungo</title>
</head>
<body>
    <h1>El camino del chungo</h1>

    {% for lugar in lugares %}

        </div>
    {% endfor %}
</body>
</html>
